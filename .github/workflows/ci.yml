name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validation tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          API_ORIGIN: https://api.sakhizadacarpet.com

      - name: Stage the standalone app for cPanel
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          vars.CPANEL_DEPLOY_ENABLED == 'true'
        run: |
          mkdir -p .next/standalone/.next/static .next/standalone/tmp
          cp -a .next/static/. .next/standalone/.next/static/
          if [ -d public ]; then
            mkdir -p .next/standalone/public
            cp -a public/. .next/standalone/public/
          fi
          date -u +%s > .next/standalone/tmp/restart.txt
          if find .next/standalone -type f \( -name '.env' -o -name '.env.*' -o -name 'carpet_sales.sql' \) -print -quit | grep -q .; then
            echo 'Refusing to package an environment file or database dump.' >&2
            exit 1
          fi

      - name: Upload cPanel frontend bundle
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          vars.CPANEL_DEPLOY_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: csms-frontend
          path: frontend/.next/standalone/
          if-no-files-found: error
          retention-days: 1

  backend:
    name: Laravel checks
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: csms_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: csms_phase1_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, mbstring, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel runtime directories
        run: |
          mkdir -p storage/app/private storage/app/public \
            storage/framework/cache/data storage/framework/sessions \
            storage/framework/testing storage/framework/views storage/logs \
            bootstrap/cache

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Install and build Laravel assets
        run: |
          npm ci
          npm run build

      - name: Create isolated test schema and seed reference data
        run: php scripts/prepare-test-database.php csms_phase1_test

      - name: Run API tests
        run: php artisan test --compact

      - name: Install production PHP dependencies
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          vars.CPANEL_DEPLOY_ENABLED == 'true'
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Stage Laravel API for cPanel
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          vars.CPANEL_DEPLOY_ENABLED == 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deploy-artifacts/backend"
          rsync -a \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='database/*.sql' \
            --exclude='database/*.sqlite*' \
            --exclude='storage/**' \
            --exclude='public/storage/' \
            ./ "$GITHUB_WORKSPACE/deploy-artifacts/backend/"
          if find "$GITHUB_WORKSPACE/deploy-artifacts/backend" -type f \( -name '.env' -o -name '.env.*' -o -name '*.sql' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print -quit | grep -q .; then
            echo 'Refusing to package an environment file or database dump.' >&2
            exit 1
          fi

      - name: Upload cPanel API bundle
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' &&
          vars.CPANEL_DEPLOY_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: csms-backend
          path: deploy-artifacts/backend/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to cPanel
    needs: [frontend, backend]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.CPANEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: csms-frontend
          path: deploy-artifacts/frontend/

      - name: Download API bundle
        uses: actions/download-artifact@v4
        with:
          name: csms-backend
          path: deploy-artifacts/backend/

      - name: Deploy Laravel API over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: deploy-artifacts/backend/
          server-dir: backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/storage/**
            **/public/storage/**
            **/*.sql
            **/*.sqlite
            **/*.sqlite3
          dangerous-clean-slate: false

      - name: Deploy Next.js app over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: deploy-artifacts/frontend/
          server-dir: frontend/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/*.sql
          dangerous-clean-slate: false

      - name: Verify live API health
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 https://api.sakhizadacarpet.com/api/health

      - name: Verify live app response
        run: curl --fail --silent --show-error --retry 12 --retry-delay 5 --output /dev/null https://app.sakhizadacarpet.com/
